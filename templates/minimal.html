<!DOCTYPE html>
<!-- kobo2mail: layout=stacked -->
<!-- Minimal: letter-like, white page, serif title, short brand rule. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$subject</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
  <tr>
    <td align="center" style="padding:40px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:560px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <tr><td style="padding-bottom:28px;">$logo_block</td></tr>
        <tr>
          <td>
            <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:36px;font-weight:normal;color:#1a202c;">$title</h1>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:16px 0 20px;">
              <tr><td width="40" height="3" style="width:40px;height:3px;background:$brand_color;font-size:0;line-height:0;">&nbsp;</td></tr>
            </table>
            <p style="margin:0 0 8px;font-size:16px;line-height:26px;color:#4a5568;">$intro</p>
          </td>
        </tr>
        <tr><td style="padding-bottom:12px;">$answers_table</td></tr>
        <tr><td style="padding-bottom:20px;">$button_block</td></tr>
        <tr>
          <td style="padding-top:20px;border-top:1px solid #e2e8f0;font-size:12px;line-height:18px;color:#a0aec0;">
            $footer<br>
            #$submission_id &middot; $submitted_at
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
