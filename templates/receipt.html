<!DOCTYPE html>
<!-- kobo2mail: layout=columns -->
<!-- Receipt: proof-of-submission style, big reference number, dashed separators, two-column answers. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$subject</title>
</head>
<body style="margin:0;padding:0;background:#e9ecef;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#e9ecef;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:540px;background:#ffffff;border-radius:4px;
                    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <tr>
          <td align="center" style="padding:28px 28px 0;">
            $logo_block
            <div style="margin-top:14px;font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:0.25em;color:#718096;">SUBMISSION RECEIPT</div>
            <div style="margin-top:8px;font-family:'Courier New',Courier,monospace;font-size:30px;line-height:36px;font-weight:bold;color:$brand_color;">#$submission_id</div>
            <div style="margin-top:4px;font-size:13px;color:#718096;">$submitted_at</div>
          </td>
        </tr>
        <tr><td style="padding:22px 28px 0;"><div style="border-top:2px dashed #cbd5e0;"></div></td></tr>
        <tr>
          <td style="padding:20px 28px 0;">
            <h1 style="margin:0 0 6px;font-size:18px;line-height:26px;color:#1a202c;">$title</h1>
            <p style="margin:0;font-size:14px;line-height:22px;color:#4a5568;">$intro</p>
          </td>
        </tr>
        <tr><td style="padding:8px 28px 0;">$answers_table</td></tr>
        <tr><td align="center" style="padding:20px 28px 0;">$button_block</td></tr>
        <tr><td style="padding:22px 28px 0;"><div style="border-top:2px dashed #cbd5e0;"></div></td></tr>
        <tr>
          <td align="center" style="padding:16px 28px 26px;font-size:12px;line-height:18px;color:#718096;">
            Keep this email as proof of your submission.<br>$footer
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
