<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>$subject</title>
</head>
<body style="margin:0;padding:0;background:#f1f4f8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f4f8;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;
                    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <tr>
          <td style="background:$brand_color;padding:24px 28px;">
            $logo_block
            <h1 style="margin:12px 0 0;font-size:22px;line-height:28px;color:#ffffff;font-weight:600;">$title</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 28px 8px;font-size:15px;line-height:22px;color:#2d3748;">
            $intro
          </td>
        </tr>
        <tr>
          <td style="padding:0 28px 24px;">
            $answers_table
          </td>
        </tr>
        <tr>
          <td style="padding:16px 28px 24px;background:#f7fafc;font-size:12px;line-height:18px;color:#718096;">
            $footer<br>
            Submission #$submission_id &middot; $submitted_at
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
