<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="kobo2mail: Kobo submission to GitHub Actions to the respondent's inbox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#fde68a"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="80" cy="360" r="120" fill="#ffffff" opacity="0.05"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="118" font-size="64" font-weight="800" fill="#ffffff">kobo<tspan fill="#fde68a">2</tspan>mail</text>
    <text x="66" y="164" font-size="22" fill="#e0e7ff">Every KoboToolbox respondent gets a beautiful</text>
    <text x="66" y="194" font-size="22" fill="#e0e7ff">copy of their answers, by email, for free.</text>

    <g font-size="14" font-weight="600">
      <rect x="66" y="226" width="150" height="32" rx="16" fill="#ffffff" opacity="0.16"/>
      <text x="141" y="247" text-anchor="middle" fill="#ffffff">No server</text>
      <rect x="226" y="226" width="170" height="32" rx="16" fill="#ffffff" opacity="0.16"/>
      <text x="311" y="247" text-anchor="middle" fill="#ffffff">Stdlib Python only</text>
      <rect x="406" y="226" width="160" height="32" rx="16" fill="#ffffff" opacity="0.16"/>
      <text x="486" y="247" text-anchor="middle" fill="#ffffff">~1 min / email</text>
    </g>

    <!-- flow -->
    <g transform="translate(640,92)">
      <!-- Kobo -->
      <rect x="0" y="0" width="140" height="150" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35"/>
      <rect x="45" y="26" width="50" height="62" rx="6" fill="#ffffff"/>
      <rect x="58" y="20" width="24" height="12" rx="3" fill="#fde68a"/>
      <rect x="54" y="44" width="32" height="5" rx="2" fill="#93c5fd"/>
      <rect x="54" y="56" width="26" height="5" rx="2" fill="#93c5fd"/>
      <rect x="54" y="68" width="30" height="5" rx="2" fill="#93c5fd"/>
      <text x="70" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Kobo form</text>
      <text x="70" y="137" text-anchor="middle" font-size="12" fill="#e0e7ff">REST Service</text>

      <line x1="146" y1="75" x2="196" y2="75" stroke="#fde68a" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

      <!-- GitHub Actions -->
      <rect x="202" y="0" width="140" height="150" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35"/>
      <circle cx="272" cy="57" r="30" fill="#ffffff"/>
      <circle cx="272" cy="57" r="11" fill="#2b6cb0"/>
      <g stroke="#2b6cb0" stroke-width="6" stroke-linecap="round">
        <line x1="272" y1="33" x2="272" y2="40"/><line x1="272" y1="74" x2="272" y2="81"/>
        <line x1="248" y1="57" x2="255" y2="57"/><line x1="289" y1="57" x2="296" y2="57"/>
      </g>
      <text x="272" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">GitHub Actions</text>
      <text x="272" y="137" text-anchor="middle" font-size="12" fill="#e0e7ff">repository_dispatch</text>

      <line x1="348" y1="75" x2="398" y2="75" stroke="#fde68a" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

      <!-- Inbox -->
      <rect x="404" y="0" width="140" height="150" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.35"/>
      <rect x="436" y="32" width="76" height="52" rx="6" fill="#ffffff"/>
      <path d="M438 36 L474 64 L510 36" fill="none" stroke="#2b6cb0" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="510" cy="32" r="12" fill="#22c55e"/>
      <path d="M504 32 L508.5 36.5 L516 28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="474" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Respondent</text>
      <text x="474" y="137" text-anchor="middle" font-size="12" fill="#e0e7ff">Gmail / SMTP</text>
    </g>

    <text x="1136" y="350" text-anchor="end" font-size="13" fill="#e0e7ff" opacity="0.8">submission → dispatch → render → send</text>
  </g>
</svg>
